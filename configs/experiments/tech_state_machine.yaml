# Tech state machine experiment — see docs/STRATEGY_TECH.md
experiment_id: tech_state_machine_v1
enabled: false  # run via scripts/run_tech.py after data manifest ready

data:
  venue: binance
  symbols: [SOXL, SNXX]
  interval: 1h
  tick_precise: true
  bar_fallback_allowed: false

execution:
  fill_modes_primary: [base, conservative]
  fill_mode_excluded_from_verdict: optimistic
  maker_first: true

state_machine:
  drawdown_sets: [A, B, C]
  short_init_frac: [0.10, 0.15, 0.20]
  soxl_snxx_weights: [[0.75, 0.25], [0.70, 0.30], [0.65, 0.35]]
  reversal_rules: [R1, R2, R3, R4, R5]
  grid_mix_stages: [G100, G75, G50, G25, dynamic]

grid:
  type: geometric
  atr_step_scan: [0.30, 0.40, 0.50, 0.60]
  atr_range_scan: [3.0, 5.0, 7.0]
  atr_timeframes: [1h, 4h]
  reanchor: [off, 7d, dynamic]
  martingale: forbidden

output:
  dir: outputs/experiments/tech_state_machine_v1
  required_artifacts: [report.md, summary.json, metrics.csv, parameters.csv, data_manifest.json]
