# Aggressive dual-hedge Martingale (VIP7 futures + rebate). Default = backtest only.
mode: backtest
symbol: BTC_USDT
interval: 1h
days: 90
market: futures
prefer_sample: true
sample_path: data_sample/BTCUSDT_1h_sample.csv
output_dir: outputs
run_name: demo_btc_dual_martingale

costs:
  vip_tier: 7
  rebate_rate: 0.75
  market: futures
  slippage_bps: 1.0
  use_maker: false
  quanto: 0.0001
  min_order_size: 1.0
  min_notional: 1.0
  apply_funding: true
  maintenance_rate: 0.005

strategy:
  name: dual_martingale
  leverage: 5.0
  long_capital: 950.0
  short_capital: 1380.0
  multiplier: 1.5
  add_drop_pct: 0.015
  take_profit_pct: 0.010
  max_adds: 40
  base_order_quote: 20.0
  cooldown_bars: 0

risk:
  # User-style investment drawdown stop: 50% or 70% of bot capital
  investment_sl_pct: 0.50
  per_trade_tp_pct: null
  per_trade_sl_pct: null
  portfolio_tp_pct: null
  portfolio_equity_sl_pct: null
  max_drawdown_stop_pct: 0.45
  stop_adding_float_loss_pct: 0.35
  force_exit_before_liq_buffer_pct: 0.20
  stop_if_price_breaks_range: false
  trailing_tp_pct: null
  trailing_activation_pct: null
  time_tp_bars: null
  scaled_tp: []

live:
  dry_run: true
