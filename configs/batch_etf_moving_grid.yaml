mode: backtest
symbol: SOXL3L_USDT
interval: tick
market: spot
feed: deals
prefer_sample: false
deals_from: "2026-06"
deals_to: "2026-08"
output_dir: outputs

costs:
  market: spot
  vip_tier: 7
  rebate_rate: 0.70
  slippage_bps: 0.0
  use_maker: true
  quanto: 0.00000001
  min_order_size: 1
  min_notional: 1.0
  apply_funding: false

strategy:
  name: moving_grid
  quote_capital: 2000.0
  grid_count: 20
  range_up_pct: 0.05
  range_down_pct: 0.05
  spacing_mode: arithmetic
  shift_on_exit: true
  move_mode: breakout
  open_base_inventory: true
  order_size_quote: 100.0
  fill_policy: last_touch

risk:
  investment_sl_pct: null
  max_drawdown_stop_pct: null
  force_exit_before_liq_buffer_pct: null
  stop_if_price_breaks_range: false

batch:
  symbols:
    - SOXL3L_USDT
    - SOXL3S_USDT
    - SNXX3L_USDT
    - SNXX3S_USDT
  intervals:
    - tick

live:
  dry_run: true
