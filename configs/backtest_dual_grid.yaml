mode: backtest
symbol: BTC_USDT
interval: 1h
days: 90
market: futures
prefer_sample: true
sample_path: data_sample/BTCUSDT_1h_sample.csv
output_dir: outputs
run_name: demo_btc_dual_grid

costs:
  vip_tier: 7
  rebate_rate: 0.75
  slippage_bps: 0.5
  use_maker: true
  quanto: 0.0001
  apply_funding: true

strategy:
  name: dual_grid
  leverage: 5.0
  long_capital: 950.0
  short_capital: 1380.0
  grid_count: 24
  spacing_pct: 0.008
  order_size_quote: 35.0
  martingale_addon: true
  multiplier: 1.4
  max_adds: 8

risk:
  investment_sl_pct: 0.70
  stop_adding_float_loss_pct: 0.40
  max_drawdown_stop_pct: 0.50
  force_exit_before_liq_buffer_pct: 0.20
  stop_if_price_breaks_range: true
  trailing_tp_pct: 0.006
  trailing_activation_pct: 0.008
  scaled_tp:
    - {profit_pct: 0.006, close_frac: 0.5}
    - {profit_pct: 0.012, close_frac: 1.0}

live:
  dry_run: true
