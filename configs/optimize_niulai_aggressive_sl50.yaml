# 牛来激进双开 — SL50 紧凑网格 + 防过拟合（非对称 long_* / short_*）
# 换币：python -m qtb.cli optimize -c <this> --symbol BTC_USDT --days 14 --cache-only
mode: backtest
symbol: 牛来_USDT
interval: 5m
days: 18
market: futures
prefer_sample: true
sample_path: data_sample/niulai_USDT_5m_futures.csv
output_dir: outputs
run_name: demo_niulai_optimize_sl50

costs:
  vip_tier: 7
  rebate_rate: 0.75
  market: futures
  slippage_bps: 1.0
  use_maker: false
  quanto: 0.0001
  min_order_size: 1.0
  min_notional: 1.0
  apply_funding: true
  maintenance_rate: 0.005

strategy:
  name: dual_martingale
  leverage: 5.0
  long_capital: 950.0
  short_capital: 1380.0
  max_adds: 90
  take_profit_pct: 0.012
  cooldown_bars: 0
  long:
    multiplier: 1.4
    add_drop_pct: 0.025
    take_profit_pct: 0.012
    base_order_quote: 237.5
  short:
    multiplier: 1.2
    add_drop_pct: 0.040
    take_profit_pct: 0.012
    base_order_quote: 291.9385

risk:
  investment_sl_pct: 0.50
  per_trade_tp_pct: null
  per_trade_sl_pct: null
  max_drawdown_stop_pct: null
  stop_adding_float_loss_pct: null
  force_exit_before_liq_buffer_pct: 0.20
  stop_if_price_breaks_range: false

optimize:
  grid: compact
  anti_overfit: true
  train_ratio: 0.70
  walk_forward_folds: 3
  monte_carlo_paths: 40
  regime_splits: 3
  top_k: 6
  heatmap_x: long_add_drop_pct
  heatmap_y: short_add_drop_pct
  # 约 16 组：围着 SL50 赢家（1.4/2.5% + 1.2/4.0%，tp 1.2%）
  params:
    long_multiplier: [1.3, 1.4]
    short_multiplier: [1.2, 1.3]
    long_add_drop_pct: [0.018, 0.025]
    short_add_drop_pct: [0.025, 0.040]
    take_profit_pct: [0.012]
    max_adds: [90]
  weights:
    return: 1.0
    max_dd: 0.9
    sharpe: 0.6
    calmar: 0.5
    win_rate: 0.25
    profit_factor: 0.35
    max_float_loss: 0.5
    liq_risk: 2.0
    fee_ratio: 0.3
    stability: 0.4

live:
  dry_run: true
