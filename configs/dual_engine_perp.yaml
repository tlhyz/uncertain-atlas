# Dual-engine state-switching perpetual strategy validation
interval: "1h"
cache_only: false
output_dir: outputs/dual_engine_perp

run_benchmarks: true
run_sweep: true
sweep_max_runs: 24
run_seed_windows: true
run_plans: true
run_similar_search: true
run_stress: true
fill_mode: base

# Binance USDT-M aggTrades (crypto tick backtest)
run_binance_c1: true
binance_c1_start: "2024-09-01"
binance_c1_end: "2024-11-30"
download_binance_trades: false

# Capital pools (USDT)
tech_book: 6500
crypto_book: 2500
global_reserve: 1000

# Fee / rebate (Gate USDT-M defaults)
futures_maker_fee: 0.00008
futures_taker_fee: 0.0002
futures_rebate: 0.75
