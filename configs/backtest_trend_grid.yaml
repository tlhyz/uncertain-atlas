mode: backtest
symbol: BTC_USDT
interval: 1h
days: 90
market: futures
prefer_sample: true
sample_path: data_sample/BTCUSDT_1h_sample.csv
output_dir: outputs
run_name: demo_btc_trend_grid

costs:
  vip_tier: 7
  rebate_rate: 0.75
  slippage_bps: 1.0
  use_maker: true
  quanto: 0.0001
  apply_funding: true

strategy:
  name: trend_grid
  leverage: 5.0
  long_capital: 950.0
  short_capital: 1380.0
  grid_count: 20
  spacing_pct: 0.010
  order_size_quote: 40.0
  ema_period: 48
  trend_threshold: 0.002
  martingale_addon: false

risk:
  investment_sl_pct: 0.50
  max_drawdown_stop_pct: 0.40
  force_exit_before_liq_buffer_pct: 0.20
  stop_if_price_breaks_range: true

live:
  dry_run: true
