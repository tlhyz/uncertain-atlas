mode: backtest
symbol: ETH3L_USDT
interval: tick
days: 0
market: spot
feed: deals
# Official monthly tape. Override with --prefer-sample for the offline sine tape.
prefer_sample: false
sample_path: data_sample/etf_deals_sample.csv
deals_from: "2026-06"
deals_to: "2026-08"
cache_only: false
output_dir: outputs
run_name: etf_moving_grid_ETH3L

costs:
  market: spot
  vip_tier: 7
  rebate_rate: 0.70
  slippage_bps: 0.0
  use_maker: true
  quanto: 0.00000001
  min_order_size: 1
  min_notional: 1.0
  apply_funding: false

strategy:
  name: moving_grid
  quote_capital: 2000.0
  grid_count: 24
  spacing_pct: 0.004
  spacing_mode: geometric
  order_size_quote: 80.0
  shift_on_exit: true
  fill_policy: last_touch
  equity_sample_seconds: 60

risk:
  # Native moving grid keeps running. Halt is opt-in only.
  investment_sl_pct: null
  per_trade_sl_pct: null
  max_drawdown_stop_pct: null
  force_exit_before_liq_buffer_pct: null
  stop_if_price_breaks_range: false

live:
  dry_run: true
