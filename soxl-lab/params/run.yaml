# 改这一份就能跑。命令行同名参数会覆盖这里。
#   python3 soxl-lab/scripts/run_grid.py
#   python3 soxl-lab/scripts/run_grid.py --leverage 3 --n-grids 80 --range-usdt 15

symbol: SOXLUSDT

window:
  start: "2026-07-16"   # 本机逐笔 2026-05-15 → 2026-09-11
  end: "2026-09-11"

leverage: 5
n_grids: 200
capital_long: 5000
capital_short: 5000

range:
  mode: usdt          # usdt = ±U；pct = ±百分比
  usdt: 20            # ±20 USDT
  pct: 0.20           # ±20%

# flatten_survivor = 移动多空对冲（一边爆仓就平另一边）
# independent     = 两本独立账（爆仓后另一边继续跑）
hedge: flatten_survivor

fee: base             # base=2bps  conservative=4bps
fills: tick           # 结论用 tick；想先快速试用 bar
tag: ""               # 输出目录前缀，可空
