[project]
name = "gate-grid-martingale"
version = "0.1.0"
description = "Gate.io spot grid + Martingale backtesting with VIP fee rebates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
plot = ["matplotlib>=3.7"]

[project.scripts]
gate-gm = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
