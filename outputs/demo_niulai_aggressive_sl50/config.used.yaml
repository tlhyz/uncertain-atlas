  train_ratio: 0.7
  walk_forward_folds: 3
  monte_carlo_paths: 40
  regime_splits: 3
  top_k: 8
  heatmap_x: add_drop_pct
  heatmap_y: take_profit_pct
  weights:
    return: 1.0
    max_dd: 0.9
    sharpe: 0.6
    calmar: 0.5
    win_rate: 0.25
    profit_factor: 0.35
    max_float_loss: 0.5
    liq_risk: 2.0
    fee_ratio: 0.3
    stability: 0.4
live:
  dry_run: true
  note: Live is a stub. Real orders require ALLOW_LIVE=1 AND dry_run=false, and still
    have no order path.
batch:
  symbols:
  - BTC_USDT
  intervals:
  - 1h
