  name: dual_martingale
  leverage: 5.0
  long_capital: 950.0
  short_capital: 1380.0
  initial_margin: 2330.0
  multiplier: 1.5
  add_drop_pct: 0.015
  take_profit_pct: 0.012
  max_adds: 90
  base_order_quote: 20.0
  fee_as_maker: false
  cooldown_bars: 0
  grid_count: 24
  spacing_pct: 0.008
  order_size_quote: 40.0
  lower: null
  upper: null
  ema_period: 48
  trend_threshold: 0.002
  martingale_addon: false
  direction: dual
  long:
    multiplier: 1.4
    add_drop_pct: 0.025
    take_profit_pct: 0.012
    base_order_quote: 237.5
  short:
    multiplier: 1.2
    add_drop_pct: 0.04
    take_profit_pct: 0.012
    base_order_quote: 291.9385
risk:
  per_trade_tp_pct: null
  per_trade_sl_pct: null
  investment_sl_pct: 0.5
  portfolio_tp_pct: null
  portfolio_equity_sl_pct: null
